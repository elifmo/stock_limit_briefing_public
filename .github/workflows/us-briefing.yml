on:
  workflow_dispatch:
    inputs:
      mail_type:
        description: "morning, intraday, or evening"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - intraday
          - evening

jobs:
  send-us-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create US tickers config
        run: |
          mkdir -p config
          cat > config/tickers_us.yaml << 'EOF'
          ${{ secrets.TICKERS_US_YAML }}
          EOF

      - name: Restore US state history
        uses: actions/cache/restore@v4
        with:
          path: reports/snapshot_history_usa.json
          key: briefing-state-us-${{ github.run_id }}
          restore-keys: |
            briefing-state-us-

      - name: Run US briefing
        env:
          PORTFOLIO: usa
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL_US: ${{ secrets.TO_EMAIL_US }}
        run: python src/main.py ${{ github.event.inputs.mail_type }} usa

      - name: Save US state history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: reports/snapshot_history_usa.json
          key: briefing-state-us-${{ github.run_id }}
