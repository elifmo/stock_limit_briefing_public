on:
  workflow_dispatch:
    inputs:
      mail_type:
        description: "morning, intraday, or evening"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - intraday
          - evening

jobs:
  send-us-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create US tickers config
        env:
          TICKERS_US_YAML: ${{ secrets.TICKERS_US_YAML }}
        run: |
          mkdir -p config
          if [ -z "$TICKERS_US_YAML" ]; then
            echo "ERROR: TICKERS_US_YAML secret is missing. Add it in repo Settings → Secrets."
            exit 1
          fi
          printf '%s\n' "$TICKERS_US_YAML" > config/tickers_us.yaml
          python -c "import yaml; d=yaml.safe_load(open('config/tickers_us.yaml')); assert d.get('tickers'), 'tickers list is empty'"

      - name: Restore US state history
        uses: actions/cache/restore@v5
        with:
          path: reports/snapshot_history_usa.json
          key: briefing-state-us-${{ github.run_id }}
          restore-keys: |
            briefing-state-us-

      - name: Run US briefing
        env:
          PORTFOLIO: usa
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL_US: ${{ secrets.TO_EMAIL_US }}
        run: |
          echo "US briefing: mail_type=${{ github.event.inputs.mail_type }} portfolio=usa"
          python src/main.py ${{ github.event.inputs.mail_type }} usa

      - name: Save US state history
        if: success()
        uses: actions/cache/save@v5
        with:
          path: reports/snapshot_history_usa.json
          key: briefing-state-us-${{ github.run_id }}
