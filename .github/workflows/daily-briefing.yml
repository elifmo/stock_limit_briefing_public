on:
  workflow_dispatch:
    inputs:
      mail_type:
        description: "morning, intraday, or evening"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - intraday
          - evening

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create tickers config
        env:
          TICKERS_YAML: ${{ secrets.TICKERS_YAML }}
        run: |
          mkdir -p config
          if [ -z "$TICKERS_YAML" ]; then
            echo "ERROR: TICKERS_YAML secret is missing."
            exit 1
          fi
          printf '%s\n' "$TICKERS_YAML" > config/tickers.yaml
          python -c "import yaml; d=yaml.safe_load(open('config/tickers.yaml')); assert d.get('tickers'), 'tickers list is empty'"

      - name: Restore state history
        uses: actions/cache/restore@v5
        with:
          path: |
            reports/snapshot_history.json
            reports/last_snapshot.json
          key: briefing-state-bist-${{ github.run_id }}
          restore-keys: |
            briefing-state-bist-

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python src/main.py ${{ github.event.inputs.mail_type }}

      - name: Save state history
        if: success()
        uses: actions/cache/save@v5
        with:
          path: |
            reports/snapshot_history.json
            reports/last_snapshot.json
          key: briefing-state-bist-${{ github.run_id }}
