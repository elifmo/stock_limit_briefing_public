on:
  workflow_dispatch:
    inputs:
      mail_type:
        description: "morning or evening"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create tickers config
        run: |
          mkdir -p config
          cat > config/tickers.yaml << 'EOF'
          ${{ secrets.TICKERS_YAML }}
          EOF

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python src/main.py ${{ github.event.inputs.mail_type }}
