on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "35 16 * * *"
  workflow_dispatch:
    inputs:
      mail_type:
        description: "morning or evening"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create tickers config
        run: |
          mkdir -p config
          cat > config/tickers.yaml << 'EOF'
          ${{ secrets.TICKERS_YAML }}
          EOF
      - name: Determine mail type
        id: mail_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.mail_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "type=morning" >> $GITHUB_OUTPUT
          else
            echo "type=evening" >> $GITHUB_OUTPUT
          fi
      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python src/main.py ${{ steps.mail_type.outputs.type }}
